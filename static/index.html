<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog Year Weather Maps</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
    select, input[type=number], input[type=date], input[type=text] {
      background: #1e293b; border: 1px solid #334155; color: #f1f5f9;
      border-radius: 8px; padding: 0.4rem 0.7rem; width: 100%; font-size: 0.875rem;
    }
    select:focus, input:focus { outline: 2px solid #38bdf8; outline-offset: 1px; border-color: transparent; }
    .tab-btn { transition: all 0.2s; border-bottom: 2px solid transparent; padding-bottom: 0.5rem; }
    .tab-btn.active { color: #38bdf8 !important; border-bottom-color: #38bdf8; }
    .tab-btn:not(.active) { color: #64748b; }
    .tab-btn:not(.active):hover { color: #94a3b8; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    .section-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; font-weight: 700; margin-bottom: 0.5rem; }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff; font-weight: 700; border-radius: 8px;
      padding: 0.55rem 1.8rem; cursor: pointer; border: none;
      transition: opacity 0.15s; font-size: 0.9rem;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm {
      background: #1e293b; border: 1px solid #334155; color: #94a3b8;
      border-radius: 6px; padding: 0.3rem 0.9rem; font-size: 0.78rem;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-sm:hover { background: #334155; color: #e2e8f0; }
    .lang-btn {
      border-radius: 6px; padding: 0.2rem 0.6rem; font-size: 0.75rem; font-weight: 700;
      cursor: pointer; border: 1px solid #334155; background: transparent; color: #64748b;
      transition: all 0.15s;
    }
    .lang-btn.active { background: #1e3a5f; border-color: #2563eb88; color: #93c5fd; }
    .spinner {
      border: 3px solid #334155; border-top-color: #38bdf8;
      border-radius: 50%; width: 22px; height: 22px;
      animation: spin 0.8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .radio-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; font-size: 0.85rem; color: #cbd5e1; cursor: pointer; }
    .radio-row input { accent-color: #38bdf8; flex-shrink: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: #0f172a; color: #64748b; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.55rem 0.9rem; text-align: left; }
    td { padding: 0.55rem 0.9rem; border-top: 1px solid #1e293b; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: #1e3a5f; border: 1px solid #2563eb44; color: #93c5fd;
      border-radius: 6px; padding: 2px 8px; font-size: 0.78rem;
    }
    .tag button { background: none; border: none; color: #93c5fd; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 0 0 2px; }
    .tip-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 50%;
      background: #1e3a5f; color: #60a5fa; font-size: 9px; font-weight: 700;
      cursor: pointer; margin-left: 4px; flex-shrink: 0;
      border: 1px solid #2563eb55; line-height: 1; user-select: none;
    }
    #tooltip {
      position: fixed; z-index: 9999; pointer-events: none;
      background: #0f172a; border: 1px solid #334155; color: #cbd5e1;
      padding: 7px 11px; border-radius: 8px; font-size: 11.5px; line-height: 1.5;
      max-width: 240px; box-shadow: 0 4px 16px rgba(0,0,0,0.6); display: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Header -->
<header class="border-b border-slate-800 px-5 py-3 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <span class="text-2xl">🌏</span>
    <div>
      <h1 class="text-lg font-extrabold tracking-tight" style="background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent">
        Analog Year Weather Maps
      </h1>
      <p class="text-xs text-slate-600 mt-0.5" data-i18n="subtitle">ERA5 reanalysis · ~5-day lag · Copernicus CDS</p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <!-- Lang toggle -->
    <div class="flex gap-1">
      <button class="lang-btn active" id="lang-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="lang-ja" onclick="setLang('ja')">日本語</button>
    </div>
    <!-- Data status -->
    <div id="status-bar" class="flex items-center gap-2 text-xs text-slate-500">
      <span id="status-text" data-i18n="status_checking"></span>
      <button class="btn-sm" onclick="fetchLatest()" id="btn-fetch-latest" data-i18n="btn_fetch_latest"></button>
    </div>
  </div>
</header>

<!-- Body -->
<div class="flex flex-1 overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-60 shrink-0 border-r border-slate-800 p-4 overflow-y-auto flex flex-col gap-4" style="background:#0c1628">

    <div>
      <div class="flex items-center mb-2">
        <span class="section-title flex-1" style="margin-bottom:0" data-i18n="lbl_variable"></span>
        <span class="tip-icon" data-tip-en="Select the atmospheric or surface variable to map. Wind speed (ws10) also draws wind direction arrows." data-tip-ja="描画する変数を選択します。地上風速(ws10)は風向矢印も表示されます。">i</span>
      </div>
      <select id="sel-var"></select>
    </div>

    <div>
      <div class="flex items-center mb-2">
        <span class="section-title flex-1" style="margin-bottom:0" data-i18n="lbl_region"></span>
        <span class="tip-icon" data-tip-en="Select the map region. Northern Hemisphere uses polar stereographic projection; others use Plate Carrée or Robinson." data-tip-ja="地図の領域を選択します。北半球は極射影、その他は正距円筒図法またはロビンソン図法を使用します。">i</span>
      </div>
      <select id="sel-region"></select>
    </div>

    <div>
      <div class="flex items-center mb-2">
        <span class="section-title flex-1" style="margin-bottom:0" data-i18n="lbl_maptype"></span>
        <span class="tip-icon" data-tip-en="Mean: raw values. Anomaly: departure from the climatology period. Standardized: anomaly divided by standard deviation (unitless)." data-tip-ja="平均値: そのままの値。偏差: 平年値との差。標準化偏差: 偏差を標準偏差で割った値（単位なし）。">i</span>
      </div>
      <div class="space-y-0.5">
        <label class="radio-row"><input type="radio" name="maptype" value="Mean" checked /> <span data-i18n="maptype_mean"></span></label>
        <label class="radio-row"><input type="radio" name="maptype" value="Anomaly (vs 1991–2020)" /> <span data-i18n="maptype_anom"></span></label>
        <label class="radio-row"><input type="radio" name="maptype" value="Standardized Anomaly" /> <span data-i18n="maptype_std"></span></label>
      </div>
    </div>

    <div>
      <div class="flex items-center mb-2">
        <span class="section-title flex-1" style="margin-bottom:0" data-i18n="lbl_clim"></span>
        <span class="tip-icon" data-tip-en="Reference period for computing anomalies and standardized anomalies." data-tip-ja="偏差・標準化偏差の計算に使う基準（平年値）期間を選択します。">i</span>
      </div>
      <select id="sel-clim">
        <option>1951–1980</option><option>1961–1990</option>
        <option>1971–2000</option><option>1981–2010</option>
        <option selected>1991–2020</option>
      </select>
    </div>

    <!-- Display settings -->
    <div>
      <div class="flex items-center mb-2">
        <span class="section-title flex-1" style="margin-bottom:0" data-i18n="lbl_display"></span>
        <span class="tip-icon" data-tip-en="Override the default visual settings. Leave fields blank to use per-variable defaults." data-tip-ja="デフォルトの表示設定を上書きします。空欄のままにすると変数ごとのデフォルト値が使用されます。">i</span>
      </div>
      <div class="space-y-2">
        <div class="grid grid-cols-2 gap-1.5">
          <div>
            <label class="flex items-center gap-1 text-xs text-slate-500 mb-0.5">vmin<span class="tip-icon" data-tip-en="Minimum color scale value. Leave blank for the variable default." data-tip-ja="カラースケールの最小値。空欄でデフォルト値を使用。">i</span></label>
            <input type="number" id="disp-vmin" data-i18n-ph="auto" step="any" />
          </div>
          <div>
            <label class="flex items-center gap-1 text-xs text-slate-500 mb-0.5">vmax<span class="tip-icon" data-tip-en="Maximum color scale value. Leave blank for the variable default." data-tip-ja="カラースケールの最大値。空欄でデフォルト値を使用。">i</span></label>
            <input type="number" id="disp-vmax" data-i18n-ph="auto" step="any" />
          </div>
        </div>
        <div>
          <label class="flex items-center gap-1 text-xs text-slate-500 mb-0.5"><span data-i18n="lbl_ci"></span><span class="tip-icon" data-tip-en="Spacing between contour lines. Leave blank to use the variable default." data-tip-ja="コンター間隔。空欄で変数のデフォルト値を使用します。">i</span></label>
          <input type="number" id="disp-ci" data-i18n-ph="auto" step="any" min="0" />
        </div>
        <div>
          <label class="flex items-center gap-1 text-xs text-slate-500 mb-0.5"><span data-i18n="lbl_cmap"></span><span class="tip-icon" data-tip-en="Color palette for the filled contours. Default is chosen per variable and map type." data-tip-ja="塗りつぶしコンターの配色です。変数・マップタイプごとのデフォルト値が使われます。">i</span></label>
          <select id="disp-cmap"></select>
        </div>
        <label class="radio-row">
          <input type="checkbox" id="disp-labels" checked style="accent-color:#38bdf8" />
          <span data-i18n="lbl_show_labels"></span>
          <span class="tip-icon" data-tip-en="Show or hide latitude/longitude grid labels on the map." data-tip-ja="地図上の緯度・経度ラベルの表示/非表示を切り替えます。">i</span>
        </label>
        <label class="radio-row" id="row-mean-overlay">
          <input type="checkbox" id="disp-mean-overlay" style="accent-color:#38bdf8" />
          <span data-i18n="lbl_mean_overlay"></span>
          <span class="tip-icon" data-tip-en="Overlay thin contours of the mean field on the anomaly shading. Helps show the absolute pattern context." data-tip-ja="偏差の着色の上に平均値のコンターを重ねます。絶対値のパターン確認に役立ちます。">i</span>
        </label>
      </div>
    </div>

    <div class="mt-auto pt-3 border-t border-slate-800">
      <p class="text-xs text-slate-700">
        Data: <a href="https://cds.climate.copernicus.eu/" target="_blank" class="text-sky-700 hover:text-sky-500">ERA5 / Copernicus CDS</a>
      </p>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto p-5">
    <!-- Tabs -->
    <div class="flex gap-5 border-b border-slate-800 mb-5">
      <button class="tab-btn active font-semibold text-sm" onclick="switchTab('composite',this)" data-i18n="tab_composite"></button>
      <button class="tab-btn font-semibold text-sm" onclick="switchTab('analog',this)" data-i18n="tab_analog"></button>
    </div>

    <!-- ══ Composite ══ -->
    <div id="tab-composite">
      <div class="flex gap-2 mb-4">
        <button class="btn-sm" id="mode-single-btn" onclick="setMode('single')" data-i18n="mode_single" style="background:#1e3a5f;border-color:#2563eb44;color:#93c5fd"></button>
        <button class="btn-sm" id="mode-multi-btn" onclick="setMode('multi')" data-i18n="mode_multi"></button>
      </div>

      <!-- Single period -->
      <div id="mode-single">
        <p class="text-sm text-slate-400 mb-3" data-i18n="composite_single_desc"></p>
        <div class="grid grid-cols-2 gap-3 max-w-sm mb-4">
          <div><label class="block text-xs text-slate-500 mb-1" data-i18n="lbl_start"></label><input type="date" id="c-start" /></div>
          <div><label class="block text-xs text-slate-500 mb-1" data-i18n="lbl_end"></label><input type="date" id="c-end" /></div>
        </div>
      </div>

      <!-- Multi-year -->
      <div id="mode-multi" class="hidden">
        <p class="text-sm text-slate-400 mb-3" data-i18n="composite_multi_desc"></p>
        <div class="grid grid-cols-2 gap-4 max-w-lg mb-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1" data-i18n="lbl_add_year"></label>
            <div class="flex gap-1.5">
              <input type="number" id="multi-year-input" placeholder="e.g. 2020" min="1950" max="2025" style="flex:1" />
              <button class="btn-sm" onclick="addYear()" data-i18n="btn_add"></button>
            </div>
            <div id="year-tags" class="flex flex-wrap gap-1 mt-2 min-h-[28px]"></div>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1" data-i18n="lbl_months"></label>
            <div id="month-checkboxes" class="grid grid-cols-4 gap-x-2 gap-y-0.5"></div>
          </div>
        </div>
      </div>

      <button class="btn-primary" id="btn-composite" onclick="drawComposite()" data-i18n="btn_draw"></button>
      <div id="composite-status" class="mt-4 hidden flex items-center gap-3 text-slate-400 text-sm">
        <div class="spinner"></div><span data-i18n="status_fetching"></span>
      </div>
      <div id="composite-error" class="mt-3 hidden card p-4 text-red-300 text-sm" style="border-color:#7f1d1d;background:#450a0a22"></div>
      <div id="composite-result" class="mt-5"></div>
    </div>

    <!-- ══ Analog ══ -->
    <div id="tab-analog" class="hidden">
      <p class="text-sm text-slate-400 mb-4" data-i18n="analog_desc"></p>
      <div class="grid grid-cols-2 gap-3 max-w-sm mb-3">
        <div><label class="block text-xs text-slate-500 mb-1" data-i18n="lbl_target_start"></label><input type="date" id="a-start" /></div>
        <div><label class="block text-xs text-slate-500 mb-1" data-i18n="lbl_target_end"></label><input type="date" id="a-end" /></div>
      </div>
      <div class="grid grid-cols-2 gap-3 max-w-sm mb-3">
        <div><label class="flex items-center gap-1 text-xs text-slate-500 mb-1"><span data-i18n="lbl_n_analogs"></span><span class="tip-icon" data-tip-en="Number of best-matching historical years to return." data-tip-ja="検索して返すアナログ年の数を指定します。">i</span></label><input type="number" id="n-analogs" value="5" min="3" max="10" /></div>
        <div><label class="flex items-center gap-1 text-xs text-slate-500 mb-1"><span data-i18n="lbl_search_from"></span><span class="tip-icon" data-tip-en="Earliest year to include in the analog search. ERA5 is available from 1940." data-tip-ja="アナログ年の検索開始年です。ERA5は1940年から利用可能です。">i</span></label><input type="number" id="search-from" value="1950" min="1950" max="2020" /></div>
      </div>
      <label class="radio-row mb-4">
        <input type="checkbox" id="use-anomaly" checked style="accent-color:#38bdf8" />
        <span data-i18n="lbl_use_anomaly"></span>
        <span class="tip-icon" data-tip-en="Compare anomaly patterns instead of raw values. Removes the mean seasonal cycle and focuses on circulation differences." data-tip-ja="絶対値ではなく偏差パターンで比較します。季節変化を除去し、循環の違いに着目できます。">i</span>
      </label>
      <button class="btn-primary" id="btn-analog" onclick="findAnalogs()" data-i18n="btn_find_analogs"></button>
      <div id="analog-status" class="mt-4 hidden flex items-center gap-3 text-slate-400 text-sm">
        <div class="spinner"></div><span id="analog-status-text" data-i18n="status_searching"></span>
      </div>
      <div id="analog-error" class="mt-3 hidden card p-4 text-red-300 text-sm" style="border-color:#7f1d1d;background:#450a0a22"></div>
      <div id="analog-table" class="mt-5 hidden card overflow-hidden">
        <table><thead><tr>
          <th data-i18n="th_year"></th>
          <th data-i18n="th_corr"></th>
          <th>RMSE</th>
          <th data-i18n="th_period"></th>
        </tr></thead><tbody id="analog-tbody"></tbody></table>
      </div>
      <div id="analog-maps" class="mt-5 space-y-5"></div>
    </div>
  </main>
</div>

<script>
// ── i18n ─────────────────────────────────────────────────────────
const I18N = {
  en: {

    status_checking:      'Checking data availability…',

    lbl_clim:             '平年値期間',

    lbl_show_labels:      '緯度経度ラベルを表示',
    lbl_mean_overlay:     '偏差図に平均値コンターを重ねる',
    tab_composite:        '📊 コンポジット図',
    tab_analog:           '🔍 アナログ年検索',

// ── State ─────────────────────────────────────────────────────────
const S = {
  vars: {}, regions: [], cmaps: [],
  mode: 'single', multiYears: new Set(),
  lang: localStorage.getItem('lang') || 'en',
  latestDate: null,
};

function t(key, vars = {}) {
  let s = I18N[S.lang][key] || I18N.en[key] || key;
  for (const [k, v] of Object.entries(vars)) s = s.replace(`{${k}}`, v);
  return s;
}

function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  // Lang buttons
  document.getElementById('lang-en').classList.toggle('active', S.lang === 'en');
  document.getElementById('lang-ja').classList.toggle('active', S.lang === 'ja');
  document.documentElement.lang = S.lang;
  // Refresh status text if date known
  if (S.latestDate) {
    document.getElementById('status-text').textContent =
      t('status_available', { date: S.latestDate });
  }
}

function setLang(lang) {
  S.lang = lang;
  localStorage.setItem('lang', lang);
  applyLang();
}

// ── Init ──────────────────────────────────────────────────────────
const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_JA = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

async function init() {
  const [vars, regions, cmaps] = await Promise.all([
    fetch('/api/variables').then(r=>r.json()),
    fetch('/api/regions').then(r=>r.json()),
    fetch('/api/colormaps').then(r=>r.json()),
  ]);
  S.vars = vars; S.regions = regions; S.cmaps = cmaps;

  const selVar = document.getElementById('sel-var');
  Object.entries(vars).forEach(([k,v]) => selVar.appendChild(new Option(v.label, k)));

  const selReg = document.getElementById('sel-region');
  regions.forEach(r => selReg.appendChild(new Option(r, r)));

  const selCmap = document.getElementById('disp-cmap');
  selCmap.appendChild(new Option('— default —', ''));
  cmaps.forEach(c => selCmap.appendChild(new Option(c, c)));

  // Month checkboxes
  buildMonthCheckboxes();

  // Default dates
  const fmt = d => d.toISOString().split('T')[0];
  const today = new Date();
  const d30 = new Date(today); d30.setDate(d30.getDate()-30);
  const d1  = new Date(today); d1.setDate(d1.getDate()-1);
  ['c-start','a-start'].forEach(id => document.getElementById(id).value = fmt(d30));
  ['c-end','a-end'].forEach(id   => document.getElementById(id).value = fmt(d1));

  // Apply language (sets all text)
  applyLang();

  // Data status
  fetch('/api/status').then(r=>r.json()).then(d => {
    S.latestDate = d.latest_available;
    document.getElementById('status-text').textContent =
      t('status_available', { date: d.latest_available });
  }).catch(()=>{});
}

function buildMonthCheckboxes() {
  const mc = document.getElementById('month-checkboxes');
  mc.innerHTML = '';
  const names = S.lang === 'ja' ? MONTHS_JA : MONTHS_EN;
  names.forEach((m, i) => {
    const lbl = document.createElement('label');
    lbl.className = 'radio-row text-xs';
    lbl.innerHTML = `<input type="checkbox" class="month-cb" value="${i+1}" style="accent-color:#38bdf8"/> ${m}`;
    mc.appendChild(lbl);
  });
}

// Rebuild month checkboxes on lang change (keep checked state)
const _origSetLang = setLang;
// Override to rebuild months
function setLang(lang) {
  const checked = new Set([...document.querySelectorAll('.month-cb:checked')].map(c=>c.value));
  S.lang = lang;
  localStorage.setItem('lang', lang);
  buildMonthCheckboxes();
  checked.forEach(v => {
    const cb = document.querySelector(`.month-cb[value="${v}"]`);
    if (cb) cb.checked = true;
  });
  applyLang();
}

// ── Tab switch ────────────────────────────────────────────────────
function switchTab(name, btn) {
  ['composite','analog'].forEach(t =>
    document.getElementById('tab-'+t).classList.toggle('hidden', t !== name));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Composite mode toggle ─────────────────────────────────────────
function setMode(m) {
  S.mode = m;
  document.getElementById('mode-single').classList.toggle('hidden', m !== 'single');
  document.getElementById('mode-multi').classList.toggle('hidden', m !== 'multi');
  const active = 'background:#1e3a5f;border-color:#2563eb44;color:#93c5fd';
  document.getElementById('mode-single-btn').style.cssText = m==='single' ? active : '';
  document.getElementById('mode-multi-btn').style.cssText  = m==='multi'  ? active : '';
}

// ── Multi-year tags ───────────────────────────────────────────────
function addYear() {
  const inp = document.getElementById('multi-year-input');
  const y = parseInt(inp.value);
  if (!y || y < 1950 || y > 2025) return;
  S.multiYears.add(y);
  inp.value = '';
  renderYearTags();
}
function removeYear(y) { S.multiYears.delete(y); renderYearTags(); }
function renderYearTags() {
  const container = document.getElementById('year-tags');
  container.innerHTML = '';
  [...S.multiYears].sort().forEach(y => {
    const span = document.createElement('span');
    span.className = 'tag';
    span.innerHTML = `${y}<button onclick="removeYear(${y})">×</button>`;
    container.appendChild(span);
  });
}

// ── Shared settings ───────────────────────────────────────────────
function getSettings() {
  const clim = document.getElementById('sel-clim').value;
  const vmin = document.getElementById('disp-vmin').value;
  const vmax = document.getElementById('disp-vmax').value;
  const ci   = document.getElementById('disp-ci').value;
  return {
    var_key:     document.getElementById('sel-var').value,
    region_name: document.getElementById('sel-region').value,
    plot_type:   document.querySelector('input[name=maptype]:checked').value,
    clim_start:  parseInt(clim.slice(0,4)),
    clim_end:    parseInt(clim.slice(5)),
    disp_vmin:   vmin !== '' ? parseFloat(vmin) : null,
    disp_vmax:   vmax !== '' ? parseFloat(vmax) : null,
    disp_ci:     ci   !== '' ? parseFloat(ci)   : null,
    disp_cmap:         document.getElementById('disp-cmap').value || null,
    disp_labels:       document.getElementById('disp-labels').checked,
    disp_mean_overlay: document.getElementById('disp-mean-overlay').checked,
  };
}

// ── Composite ────────────────────────────────────────────────────
async function drawComposite() {
  const btn  = document.getElementById('btn-composite');
  const stat = document.getElementById('composite-status');
  const err  = document.getElementById('composite-error');
  const res  = document.getElementById('composite-result');
  err.classList.add('hidden'); res.innerHTML = '';
  stat.classList.remove('hidden'); btn.disabled = true;

  try {
    const body = { ...getSettings() };

    if (S.mode === 'multi') {
      const months = [...document.querySelectorAll('.month-cb:checked')].map(c=>parseInt(c.value));
      if (S.multiYears.size === 0) throw new Error(t('err_no_year'));
      if (months.length === 0)     throw new Error(t('err_no_month'));
      body.multi_years  = [...S.multiYears].sort();
      body.multi_months = months;
    } else {
      body.start_date = document.getElementById('c-start').value;
      body.end_date   = document.getElementById('c-end').value;
      if (body.start_date >= body.end_date) throw new Error(t('err_date_order'));
    }

    const resp = await fetch('/api/composite', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    if (!resp.ok) { const d = await resp.json(); throw new Error(d.detail || resp.statusText); }
    const data = await resp.json();
    res.innerHTML = `<img src="${data.image}" class="rounded-xl w-full shadow-xl" />`;
  } catch(e) {
    err.textContent = '⚠ ' + e.message; err.classList.remove('hidden');
  } finally { stat.classList.add('hidden'); btn.disabled = false; }
}

// ── Fetch latest ─────────────────────────────────────────────────
async function fetchLatest() {
  const btn = document.getElementById('btn-fetch-latest');
  btn.disabled = true; btn.textContent = t('btn_fetching');
  try {
    const r = await fetch('/api/fetch_latest', { method: 'POST' });
    const d = await r.json();
    if (d.ok) {
      S.latestDate = d.fetched_through;
      document.getElementById('status-text').textContent =
        t('status_fetched', { date: d.fetched_through });
    }
  } catch(e) { /* silent */ }
  finally { btn.disabled = false; btn.textContent = t('btn_fetch_latest'); }
}

// ── Analog finder ────────────────────────────────────────────────
async function findAnalogs() {
  const btn      = document.getElementById('btn-analog');
  const stat     = document.getElementById('analog-status');
  const statText = document.getElementById('analog-status-text');
  const err      = document.getElementById('analog-error');
  const tbl      = document.getElementById('analog-table');
  const tbody    = document.getElementById('analog-tbody');
  const maps     = document.getElementById('analog-maps');
  err.classList.add('hidden');
  tbl.classList.add('hidden');
  tbody.innerHTML = ''; maps.innerHTML = '';
  stat.classList.remove('hidden'); btn.disabled = true;

  try {
    const aStart = document.getElementById('a-start').value;
    const aEnd   = document.getElementById('a-end').value;
    if (aStart >= aEnd) throw new Error(t('err_date_order'));

    const body = {
      ...getSettings(),
      start_date: aStart, end_date: aEnd,
      n_analogs:         parseInt(document.getElementById('n-analogs').value),
      search_start_year: parseInt(document.getElementById('search-from').value),
      use_anomaly:       document.getElementById('use-anomaly').checked,
    };

    const resp = await fetch('/api/analog', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    if (!resp.ok) { const d = await resp.json(); throw new Error(d.detail || resp.statusText); }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const msg = JSON.parse(line.slice(6));
        if (msg.error) throw new Error(msg.error);
        if (msg.status) statText.textContent =
          msg.status.includes('Plotting') ? t('status_plotting') : t('status_searching');
        if (msg.analogs) {
          tbody.innerHTML = '';
          msg.analogs.forEach(a => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="font-bold" style="color:#38bdf8">${a.year}</td>
              <td>${a.correlation.toFixed(3)}</td>
              <td class="text-slate-400">${a.rmse.toFixed(2)}</td>
              <td class="text-slate-500 text-xs">${a.start_date} – ${a.end_date}</td>`;
            tbody.appendChild(tr);
          });
          tbl.classList.remove('hidden');
        }
        if (msg.target_image) {
          const div = document.createElement('div');
          div.innerHTML = `<p class="text-sm font-semibold text-white mb-2">${t('lbl_target_period')}</p>
            <img src="${msg.target_image}" class="rounded-xl w-full shadow-xl" />`;
          maps.prepend(div);
        }
        if (msg.analog_image) {
          const {year, r, image} = msg.analog_image;
          const div = document.createElement('div');
          div.innerHTML = `<p class="text-sm font-semibold text-white mb-2">
            ${t('lbl_analog')}: <span style="color:#38bdf8">${year}</span>
            <span class="text-slate-500 font-normal ml-2">r = ${r.toFixed(3)}</span></p>
            <img src="${image}" class="rounded-xl w-full shadow-xl" />`;
          maps.appendChild(div);
        }
        if (msg.done) break;
      }
    }
  } catch(e) {
    err.textContent = '⚠ ' + e.message; err.classList.remove('hidden');
  } finally { stat.classList.add('hidden'); btn.disabled = false; }
}

// Show mean-overlay checkbox only when anomaly map type is selected
function updateMeanOverlayVisibility() {
  const pt = document.querySelector('input[name=maptype]:checked')?.value || '';
  const row = document.getElementById('row-mean-overlay');
  row.style.display = pt.includes('Anomaly') ? 'flex' : 'none';
}
document.querySelectorAll('input[name=maptype]').forEach(r =>
  r.addEventListener('change', updateMeanOverlayVisibility)
);

// Enter key on multi-year input
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('multi-year-input')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') addYear();
  });
  updateMeanOverlayVisibility();
});

// ── Tooltips ──────────────────────────────────────────────────────
{
  const tt = document.createElement('div');
  tt.id = 'tooltip';
  document.body.appendChild(tt);
  document.addEventListener('mouseover', e => {
    const el = e.target.closest('.tip-icon');
    if (!el) return;
    const text = S.lang === 'ja' ? el.dataset.tipJa : el.dataset.tipEn;
    if (!text) return;
    tt.textContent = text; tt.style.display = 'block';
  });
  document.addEventListener('mousemove', e => {
    if (tt.style.display === 'none') return;
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + 260 > window.innerWidth)  x = e.clientX - 260;
    if (y + 100 > window.innerHeight) y = e.clientY - 100;
    tt.style.left = x + 'px'; tt.style.top = y + 'px';
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('.tip-icon')) tt.style.display = 'none';
  });
}

init();
</script>
